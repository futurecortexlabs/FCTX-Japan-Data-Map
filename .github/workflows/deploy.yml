name: CI / Deploy

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (with coverage)
        run: npm run test:coverage -- --coverage.reporter=text --coverage.reporter=json-summary

      - name: Coverage summary
        if: always()
        run: |
          node -e "const t=require('./coverage/coverage-summary.json').total;console.log(['lines','statements','functions','branches'].map(k=>'| '+k+' | '+t[k].pct+'% |').join('\n'))" > coverage.md || true
          { echo '### Test coverage'; echo '| metric | % |'; echo '|---|---|'; cat coverage.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build

      - name: Bundle size report
        run: |
          { echo '### Bundle'; echo '```'; du -h dist/assets/* | sort -h; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
