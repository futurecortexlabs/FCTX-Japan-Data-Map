version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react*']
      lint:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'globals']
      build-and-test:
        patterns: ['vite', '@vitejs/*', 'vitest', '@vitest/*', 'typescript', '@tailwindcss/*', 'tailwindcss']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
